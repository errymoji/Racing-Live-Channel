<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    
    <!-- Load HLS.js library to play .m3u8 files -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 300;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Styling the native HTML5 video player */
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>F1 Baku Stream</h1>
    
    <div class="video-container">
        <!-- Native HTML5 Video Element (muted for autoplay) -->
        <video id="video-player" controls autoplay muted></video>
    </div>

    <script>
        const video = document.getElementById('video-player');
        
        // Your extracted source link
        const videoSrc = 'https://lb7.strmd.st/secure/hzYoUTPZaQxBbFHXvZiPVYJCHpBzFHpA/hotel/stream/baku-city-circuit-free-practice-1-formula-1-1790238600/1/playlist.m3u8';

        // Check if the browser supports HLS.js (Chrome, Firefox, Edge, etc.)
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            // Auto-start the video once it is ready
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } 
        // Safari has built-in HLS support and doesn't need HLS.js
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
